}
function segRow(label,key,opts){
  return h('div',{class:'field'},h('div',{class:'lbl'},label),
    h('div',{class:'seg',role:'group','aria-label':label},opts.map(function(o){
      return h('button',{type:'button','aria-pressed':String(S[key]===o[0]),on:{click:function(){ S[key]=o[0]; applySettings(); saveS(); renderSheet(); }}},o[1]);
    })));
}
function switchRow(label,on,fn,note){
  var sw=h('button',{class:'sw',type:'button',role:'switch','aria-checked':String(on),'aria-label':label,on:{click:fn}});
  return h('div',{class:'field'},h('div',{class:'row2'},h('span',{class:'lbl'},label),sw),note?h('p',{class:'muted'},note):null);
}
var awakeNote='';
function viewDisp(){
  return h('div',{class:'stack'},
    rangeRow('Text size','fs',15,36,1,function(v){return v+' px';}),
    rangeRow('Line spacing','lh',1.3,2,0.05,function(v){return (+v).toFixed(2);}),
    segRow('Column width','measure',[[30,'Narrow'],[36,'Medium'],[46,'Wide']]),
    segRow('Typeface','font',[['serif','Serif'],['sans','Sans']]),
    segRow('Theme','theme',[['auto','Auto'],['light','Light'],['sepia','Sepia'],['dark','Dark']]),
    switchRow('Keep screen awake',S.awake,async function(){
      S.awake=!S.awake; saveS(); awakeNote='';
      var ok=await setAwake(S.awake);
      if(S.awake&&!ok){ awakeNote='This browser did not allow it here. Your screen may still dim.'; }
      renderSheet();
    },awakeNote||'Stops the screen dimming while you knit.'));
}
var wl=null;
async function setAwake(on){
  try{
    if(on){
      if(!navigator.wakeLock) return false;
      if(document.visibilityState==='visible'&&!wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',function(){ wl=null; }); }
      return !!wl;
    }
    if(wl){ await wl.release(); wl=null; }
    return true;
  }catch(e){ wl=null; return false; }
}
document.addEventListener('visibilitychange',function(){ if(S.awake&&document.visibilityState==='visible') setAwake(true); });

function snippet(x){ return x.t.replace(/\s+/g,' ').trim(); }
function viewHl(){
  var box=h('div',{class:'stack'});
  var counts={1:0,2:0,3:0,4:0}; D.hl.forEach(function(x){ counts[x.c]++; });
  var layers=h('div',null,h('h3',{class:'h4'},'Layers'),
    h('div',{class:'layer'},h('span',{class:'nm'},'Show all highlights'),
      h('button',{class:'sw',type:'button',role:'switch','aria-checked':String(D.hlOn),'aria-label':'Show all highlights',on:{click:function(){ D.hlOn=!D.hlOn; mutated(null); }}})),
    [1,2,3,4].map(function(c){
      return h('div',{class:'layer'},h('span',{class:'chip c'+c}),h('span',{class:'nm'},COLORS[c]),h('span',{class:'cnt'},counts[c]),
        h('button',{class:'sw',type:'button',role:'switch','aria-checked':String(D.layers[c]!==false),'aria-label':COLORS[c]+' highlights',on:{click:function(){ D.layers[c]=!(D.layers[c]!==false); mutated(null); }}}));
    }));
  box.append(layers);
  var sorted=D.hl.slice().sort(function(a,b){ return a.b-b.b||a.s-b.s; });
  if(!sorted.length){ box.append(h('p',{class:'muted'},'No highlights yet. Select text and tap a color, or turn on row tapping and tap a row.')); return box; }
  box.append(h('div',null,h('h3',{class:'h4'},sorted.length+(sorted.length===1?' highlight':' highlights')),
    h('ul',{class:'list'},sorted.map(function(x){
      return h('li',null,h('span',{class:'chip c'+x.c}),
        h('button',{class:'main',type:'button',on:{click:function(){ goTo(x); }}},h('div',{class:'snip'},snippet(x)),h('div',{class:'sub'},'Page '+pageOf(x.b))),
        h('button',{class:'ib',type:'button','aria-label':'Delete this highlight',on:{click:function(){ removeHl(x.id); }}},h('span',{'data-ic':'trash'})));
    }))));
  var acts=h('div',{class:'btns'});
  acts.append(h('button',{class:'btn alt small',type:'button',on:{click:doCopy}},'Copy all'));
  if(!clearing) acts.append(h('button',{class:'btn danger small',type:'button',on:{click:function(){ clearing=true; renderSheet(); }}},'Clear all'));
  else {
    acts.append(h('button',{class:'btn danger small',type:'button',on:{click:function(){ D.hl=[]; clearing=false; mutated(null); }}},'Remove all '+D.hl.length));
    acts.append(h('button',{class:'btn alt small',type:'button',on:{click:function(){ clearing=false; renderSheet(); }}},'Keep them'));
  }
  box.append(acts);
  if(copyText) box.append(h('div',{class:'field'},h('p',{class:'muted'},'Copying was blocked here. Select the text below and copy it.'),h('textarea',{id:'copybox',readonly:true},copyText)));
  return box;
}
function doCopy(){
  var lines=D.hl.slice().sort(function(a,b){return a.b-b.b||a.s-b.s;}).map(function(x){ return '['+COLORS[x.c]+', p.'+pageOf(x.b)+'] '+snippet(x); });
  var text=D.title+'\n\n'+lines.join('\n');
  var fail=function(){ copyText=text; renderSheet(); var t=$('#copybox'); if(t){ t.focus(); t.select(); } };
  try{ navigator.clipboard.writeText(text).then(function(){ showToast('Copied '+lines.length+' highlights'); },fail); }catch(e){ fail(); }
}
function goTo(x){
  closeSheet(); if(!D.hlOn||D.layers[x.c]===false){ ensureVisible(x.c); mutated(null); }
  var el=blockEls[x.b]; if(el){ el.scrollIntoView({block:'center'}); }
  setActive(x.id); updateDock();
}

/* ---------- opening PDFs ---------- */
function showLoading(msg,pct){
  reader.replaceChildren(h('div',{class:'state'},h('div',null,msg),h('progress',{max:100,value:pct||0})));
}
function showError(e,name){
  var pw=e&&(e.name==='PasswordException');
  reader.replaceChildren(h('div',{class:'state'},
    h('h2',null,pw?'This PDF is password protected':'This PDF could not be read'),
    h('div',null,pw?'Remove the password in another app, then open it again.':((e&&e.message)||'Try a different file.')),
    h('button',{class:'btn',type:'button',on:{click:function(){ openSheet('lib'); }}},'Back to library')));
}
async function openFile(f){
  if(!f) return; closeSheet();
  showLoading('Opening '+f.name+'…',2);
  try{ var buf=await f.arrayBuffer(); await openBytes(new Uint8Array(buf),f.name.replace(/\.pdf$/i,'')); }
  catch(e){ showError(e); }
}
async function openBytes(bytes,name){
  var lib=window.pdfjsLib; if(!lib) throw new Error('The PDF engine did not load. Check your connection and try again.');
  lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  var doc=await lib.getDocument({data:bytes.slice()}).promise;
  var id=(doc.fingerprints&&doc.fingerprints[0])||(name+':'+bytes.length);
  var rec=await idb.get(id), blocks,pages;
  if(rec&&rec.v===EXV&&rec.blocks){ blocks=rec.blocks; pages=rec.pages; }
  else {
    var raw=await extractPages(doc,function(n,t){ showLoading('Reading page '+n+' of '+t+'…',Math.round(n/t*100)); });
    stripMargins(raw);
    var built=buildBlocks(raw,bodySize(raw)); blocks=built.blocks; pages=built.pages;
    var ok=await idb.put({id:id,name:name,v:EXV,data:bytes,blocks:blocks,pages:pages});
    if(ok) addToLibrary({id:id,name:name,pages:doc.numPages,size:bytes.length,added:Date.now()});
  }
  store.set('stitch:last',id);
  setDoc({id:id,title:name,blocks:blocks,pages:pages,pdf:doc,bytes:bytes});
}
async function openStored(id){
  showLoading('Opening…',20);
  var rec=await idb.get(id);
  if(!rec||rec.v!==EXV){ if(rec){ try{ await openBytes(new Uint8Array(rec.data),rec.name); return; }catch(e){ showError(e); return; } } removeFromLibrary(id); loadSample(); return; }
  store.set('stitch:last',id);
  setDoc({id:id,title:rec.name,blocks:rec.blocks,pages:rec.pages,bytes:rec.data instanceof Uint8Array?rec.data:new Uint8Array(rec.data)});
}
function addToLibrary(m){
  var lib=store.get('stitch:library',[]).filter(function(x){return x.id!==m.id;}); lib.unshift(m);
  lib.splice(8).forEach(function(x){ idb.del(x.id); });
  store.set('stitch:library',lib);
}
function removeFromLibrary(id){
  idb.del(id); store.set('stitch:library',store.get('stitch:library',[]).filter(function(x){return x.id!==id;}));
  store.del('stitch:doc:'+id);
  if(store.get('stitch:last',null)===id){ store.del('stitch:last'); if(D&&D.id===id) loadSample(); }
  if(sheetView==='lib') renderSheet();
}
$('#file').addEventListener('change',function(e){ var f=e.target.files&&e.target.files[0]; e.target.value=''; if(f) openFile(f); });
document.addEventListener('dragover',function(e){ e.preventDefault(); });
document.addEventListener('drop',function(e){ e.preventDefault(); var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0]; if(f) openFile(f); });

/* ---------- start ---------- */
applySettings(); hydrate(document);
loadSample();
(function(){ var last=store.get('stitch:last',null), lib=store.get('stitch:library',[]);
  if(last&&lib.some(function(x){return x.id===last;})) openStored(last); })();
if(S.awake) setAwake(true);
})();
</script>
